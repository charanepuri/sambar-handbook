{% extends 'handbook/base.html' %}

{% block title %}Gallery Page- Sambar Handbook{% endblock %}

{% block content %}
    <h2>Image Gallery</h2>

    <div class="row g-4">

        {% for image in images %}

            <div class="col-md-4">

                <div class="card shadow h-100">

                    <img src="{{ image.image.url }}" class="card-img-top" alt="{{ image.title }}">

                    <div class="card-body">

                        <h5>
                            {{ image.title }}
                        </h5>

                        <p class="text-muted mb-0">
                            {{ image.category }}
                        </p>

                    </div>

                </div>

            </div>

        {% endfor %}

    </div>

{% endblock %}
